          name: destination_id
          description: 'Filter by destination ID (see GET /destinations).'
          example: null
          required: false
          schema:
            type: string
            description: 'Filter by destination ID (see GET /destinations).'
            example: null
        -
          in: query
          name: type_id
          description: 'Filter by tour type ID (see GET /tour-types).'
          example: null
          required: false
          schema:
            type: string
            description: 'Filter by tour type ID (see GET /tour-types).'
