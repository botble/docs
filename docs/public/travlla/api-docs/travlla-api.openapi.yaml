    description: ''
  -
    name: 'Tour Manager - Vendor'
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Get a token from <b>POST /api/v1/tour-manager/auth/login</b> (or register). Send it as <b>Authorization: Bearer {token}</b>. If an API key is set in Admin &gt; Settings &gt; API, also send it in the <b>X-API-KEY</b> header.'
security:
  -
    default: []
