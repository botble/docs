# Redirects for removed/renamed docs.botble.com pages (included in docs.botble.com.ssl.conf).
# 2026-11-04: old FOB sms-gateway docs removed; plugin superseded by sms-gateways.
location = /sms-gateway { return 301 /sms-gateways/; }
location ^~ /sms-gateway/ {
  rewrite ^/sms-gateway/installation(\.html)?$ /sms-gateways/installation.html permanent;
  rewrite ^/sms-gateway/phone-verification(\.html)?$ /sms-gateways/usage/otp.html permanent;
  rewrite ^/sms-gateway/logging(\.html)?$ /sms-gateways/usage/delivery-logs.html permanent;
  rewrite ^/sms-gateway/extending(\.html)?$ /sms-gateways/developer/custom-driver.html permanent;
  rewrite ^/sms-gateway/services/twilio(\.html)?$ /sms-gateways/drivers/twilio.html permanent;
  rewrite ^/sms-gateway/services/nexmo(\.html)?$ /sms-gateways/drivers/vonage.html permanent;
  return 301 /sms-gateways/;
}
